<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS Clinic - Jailbreak</title>
<style>
  :root {
    --bg-main: #090b0e;
    --bg-card: #131720;
    --border-color: #1e2634;
    --accent-color: #0070d1; /* لون بلايستيشن المميز */
    --text-main: #e6ebf2;
    --text-muted: #8b95a3;
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
  }

  html, body { 
    margin: 0; 
    padding: 0; 
    background: var(--bg-main); 
    color: var(--text-main);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #brand { 
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px; 
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  #brand img { 
    width: 36px; 
    height: 36px; 
    margin-right: 12px; 
    border-radius: 50%;
    border: 2px solid var(--accent-color);
    object-fit: cover;
  }

  #brand b { 
    font-size: 18px; 
    font-weight: 700; 
    letter-spacing: .18em;
    color: #ffffff;
    text-transform: uppercase;
  }

  #container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #wrap { 
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 32px 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    text-align: center;
  }

  #state { 
    font-size: 24px; 
    font-weight: 700; 
    margin: 0 0 12px;
    letter-spacing: 0.05em;
  }

  #det { 
    font-size: 14px; 
    color: var(--text-muted); 
    margin: 0 0 16px; 
  }

  #det b { 
    color: var(--text-main); 
    font-weight: 600; 
  }

  #cache { 
    font-size: 13px; 
    color: var(--text-muted); 
    margin: 0; 
    min-height: 18px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    display: inline-block;
  }

  #cache.cacheok { 
    color: var(--success); 
    background: rgba(63, 185, 80, 0.1);
  }

  .ok { color: var(--success) !important; } 
  .bad { color: var(--danger) !important; } 
  .warn { color: var(--warning) !important; }

  /* تأثيرات جمالية تناسب الشاشات الكبيرة وجهاز التحكم */
  #wrap:hover {
    border-color: rgba(0, 112, 209, 0.4);
  }
</style>
</head>
<body>

<div id="brand">
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAYAAADimHc4AAA3tUlEQVR42t29d5xV5bn3/b3v1XaZmT3MDG2Gjoo0KQJSREHAEvuJVowxia9503NSjq9PmtEkGp9TzJNzToo6aclLURANJNBELIgIqVRAQkI44Q2f67LLqfb9/7L3HYZiBQUly8uzPZ39mZs1ea691XffVfle5BX/Dl9ZaAhKIhBC6eFwIgVJqYBiGI48cOTI6Foudb9v2kCiKqtva2ipbWlpKwjCMKaVMIQSGYYSGYty0+76czmUxDNps95Pv+/ubm5h1tbW3glbbu7Gxsbt99zzz11nb5bLF++3Fi+fLn67ne/q/5WNBB/A6KLAtG1EEJ1OD44l/*...الخ*/" alt="PS Clinic">
  <b>PS CLINIC</b>
</div>

<div id="container">
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <br>
    <div id="cache"></div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
